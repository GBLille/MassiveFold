[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "massivefold"
dynamic = ["version"]
description = "MassiveFold: massive sampling of protein structure predictions with AFmassive, ColabFold and AlphaFold3"
readme = "README.md"
license = "CECILL-2.1"
requires-python = ">=3.10"
dependencies = [
  "biopython>=1.81",
  "glypy>=1.0.14",
  "matplotlib>=3.8",
  "numpy>=2",
  "pandas>=2.2",
  "scipy>=1.13",
  "seaborn>=0.13",
  "simple-slurm>=0.3.6",
  "tqdm>=4.66",
]

[project.scripts]
massivefold = "massivefold.cli:main"
massivefold_plots = "massivefold.massivefold_plots:cli"
gather = "massivefold.gather_runs:main"
get_batch = "massivefold.parallelization.get_batch:main"
unifier = "massivefold.parallelization.unifier:main"
organize_outputs = "massivefold.parallelization.organize_outputs:main"
lighten_output = "massivefold.parallelization.lighten_output:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "massivefold.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
massivefold = [
  "parallelization/**/*.py",
  "parallelization/**/*.json",
  "parallelization/headers/*.slurm",
  "parallelization/templates/**/*",
  "plots/**/*.py",
  "examples/*",
  "engines/pixi.toml",
  "engines/pixi.lock"
]
